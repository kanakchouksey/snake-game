<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section>
            <div class="infos">

                <!-- information of high score  -->
                <div class="score-time-info">
                    <h3>High Score :
                        <span id="high-score">0</span>
                    </h3>
                </div>

                <!-- information of score achive at running time of game   -->
                <div class="score-time-info">
                    <h3>Score :
                        <span id="score">0</span>
                    </h3>
                </div>


                <!--  information of running time  -->
                <div class="score-time-info">
                    <h3>Time :
                        <span id="time">00-00</span>
                    </h3>
                </div>






            </div>


            <div class="board">
                <!-- <div class="block"></div> -->
              
              
            </div>


        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
